<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enquo</title>
    <script>
      // Single Page Apps for GitHub Pages — MIT, https://github.com/rafgraph/spa-github-pages
      // Rewrites the path into a query string so index.html can restore it.
      // `pathSegmentsToKeep` = 1 because the site lives under /enquo/.
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
